---
# Attach the SBOMs scan.yml produced to the published digests, as cosign
# attestations -- keyed (what policy could one day verify) and keyless
# (the workflow identity), the same dual story as the signatures. One
# concern per workflow, one hop downstream of the scan: this fires when
# a scan run completes, reads the plan it passed along, downloads each
# leg's SBOM artifact, and attests it onto that leg's published digest.
# Pull requests publish nothing to attest onto, so their scan runs end
# here.
name: Attest Bluespin SBOMs
on:
  workflow_run:
    workflows:
      - Scan Bluespin images
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  attest:
    name: attest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    env:
      IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
      GH_TOKEN: ${{ github.token }}
    steps:
      # For .github/scripts/retry.sh
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the scan run's plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Nothing to attest on a pull request
        id: gate
        run: |
          set -euo pipefail
          if [[ "$(jq -r .event plan.json)" == "pull_request" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        if: steps.gate.outputs.skip == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: steps.gate.outputs.skip == 'false'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.3'

      - name: Attest every leg's SBOM
        if: steps.gate.outputs.skip == 'false'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          SCAN_RUN: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          reg="${IMAGE_REGISTRY,,}"

          attest_leg() { # attest_leg <platform> <tag>
            local platform=$1 tag=$2 digest dir
            if ! digest="$(skopeo inspect --no-tags --format '{{.Digest}}' \
                "docker://${reg}/${platform}:${tag}" 2>/dev/null)"; then
              echo "::warning::${platform}:${tag} did not resolve; skipping"
              return 0
            fi
            dir="$(mktemp -d)"
            gh run download "${SCAN_RUN}" -R "${REPO}" \
              -n "sbom-${platform}-${tag}" -D "${dir}"
            # Keyed then keyless; retried, same Rekor reasoning as
            # retry.sh explains. The package-level SPDX is the attested
            # document -- sized for Rekor's request cap by construction.
            .github/scripts/retry.sh 3 30 \
              cosign attest -y --key env://COSIGN_PRIVATE_KEY \
              --predicate "${dir}/sbom.spdx.json" --type spdxjson "${reg}/${platform}@${digest}"
            .github/scripts/retry.sh 3 30 \
              cosign attest -y \
              --predicate "${dir}/sbom.spdx.json" --type spdxjson "${reg}/${platform}@${digest}"
            rm -rf "${dir}"
          }

          for leg in $(jq -r '.bluespin[] | "\(.fedora_branch)-\(.arch)"' plan.json); do
            attest_leg bluespin "${leg}"
          done
          for leg in $(jq -r '.dx[].fedora_branch' plan.json); do
            attest_leg bluespin-dx "${leg}"
          done
          for leg in $(jq -r '.surface[].fedora_branch' plan.json); do
            attest_leg bluespin-surface "${leg}"
          done
          for leg in $(jq -r '.fp5[].fedora_branch' plan.json); do
            attest_leg bluespin-fp5 "${leg}"
          done
