---
name: Validate Flatpaks
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "files/usr/share/flatpak/preinstall.d/**"
      - "files/usr/share/bluespin/flatpaks/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Flathub
        shell: bash
        run: |
          sudo apt install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Validate flatpak preinstall files
        shell: bash
        run: |
          set -euo pipefail
          find files/usr/share/flatpak/preinstall.d -iname '*.preinstall' -print0 | \
            while IFS= read -r -d '' flatpaks_file; do
              echo "::group:: ===$(basename "$flatpaks_file")==="
              # Availability is per-architecture, and `remote-info` without
              # --arch answers for the runner (x86_64) only. An aarch64 image
              # could otherwise ship preinstall entries that do not resolve on
              # the device and this job would still pass. Each file declares
              # the arches it is shipped on; the FIRST is the file's native
              # arch and failures there are fatal, while a missing build on a
              # secondary arch is a ::warning:: -- those entries are skipped on
              # the device rather than being errors, and hard-failing on them
              # would block the shared lists for every variant.
              arches=$(sed -n 's/^# bluespin-arches: //p' "$flatpaks_file" | head -1)
              arches=${arches:-x86_64}
              primary=${arches%% *}
              echo "arches: ${arches} (primary: ${primary})"
              while IFS= read -r app_id; do
                branch=$(awk -v app="$app_id" '
                  $0 == "[Flatpak Preinstall " app "]" {found=1; next}
                  found && /^Branch=/ {print; valid=1; exit}
                  found && /^\[/ {exit}
                  END {if (!valid) print "MISSING"}
                ' "$flatpaks_file")
                if [ "$branch" = "MISSING" ]; then
                  echo "✗ $app_id: missing Branch= key"
                  exit 1
                fi
                for arch in ${arches}; do
                  if ! info=$(flatpak remote-info --user --arch="${arch}" flathub "${app_id}" 2>&1); then
                    # Print flatpak's own output either way: a network error
                    # and a genuinely missing build exit the same, and only
                    # the message tells them apart.
                    echo "${info}"
                    if [ "${arch}" = "${primary}" ]; then
                      echo "✗ $app_id failed to resolve for ${arch}"
                      exit 1
                    fi
                    echo "::warning::${app_id} is unavailable for ${arch} on Flathub and will be skipped on that architecture"
                    continue
                  fi
                  echo "${info}"
                  if grep -q "End-of-life" <<< "${info}"; then
                    echo "✗ $app_id is end-of-life (renamed or unmaintained), update or remove it"
                    exit 1
                  fi
                done
              done < <(sed -n 's/^\[Flatpak Preinstall \(.*\)\]$/\1/p' "$flatpaks_file")
              echo "::endgroup::"
            done

      # The opt-in catalogs (`ujust install-flatpaks`) are plain lists of
      # app ids; hold them to the same standard
      - name: Validate opt-in catalogs
        shell: bash
        run: |
          set -euo pipefail
          find files/usr/share/bluespin/flatpaks -iname '*.list' -print0 | \
            while IFS= read -r -d '' list_file; do
              echo "::group:: ===$(basename "$list_file")==="
              while IFS= read -r app_id; do
                info=$(flatpak remote-info --user flathub "${app_id}")
                echo "${info}"
                if grep -q "End-of-life" <<< "${info}"; then
                  echo "✗ $app_id is end-of-life (renamed or unmaintained), update or remove it"
                  exit 1
                fi
              done < <(grep -vE '^[[:space:]]*(#|$)' "$list_file" | sed -n 's/^\([^# ]*\).*$/\1/p')
              echo "::endgroup::"
            done
