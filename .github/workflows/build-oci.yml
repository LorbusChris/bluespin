---
# One image build leg, called per platform x branch by build.yml -- the
# bluespin job first, then the variant jobs that layer on its image. This
# builds, rechunks, and hands the result over: shared as an artifact on
# pull requests, pushed and tag-verified on main. Everything downstream
# is its own workflow, fired on this run's completion -- sign.yml,
# scan.yml (and attest.yml after it), validate-gnome-extensions.yml,
# and the media workflows for the *-installer/*-disk labels.
name: Build OCI
on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      fedora_branch:
        type: string
        required: true
      image_desc:
        type: string
        required: true
      from_bluespin:
        description: 'Layer on the published bluespin image (pushes only)'
        type: boolean
        default: false
      runner:
        description: 'Runner label; the fp5 leg builds natively on arm'
        type: string
        default: 'ubuntu-24.04'
      arch:
        description: 'Architecture the published manifest must have'
        type: string
        default: 'amd64'
      tag_suffix:
        description: 'Appended to every tag this leg publishes -- the multi-arch branches publish per-arch instance tags the manifest job stitches'
        type: string
        default: ''
      bluespin_tag_suffix:
        description: 'Arch suffix of the bluespin tag a from_bluespin leg chains FROM'
        type: string
        default: ''
      from_image_artifact:
        description: 'On pull requests, the artifact holding the bluespin base image to build FROM'
        type: string
        default: ''
      from_image_run_id:
        description: 'Run to download from_image_artifact from (empty: this run)'
        type: string
        default: ''

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

jobs:
  build_push:
    # f44 / rawhide -- not frawhide; the arch is the OCI name, the same
    # vocabulary the tags and platform fields use
    name: ${{ inputs.platform }} on ${{ inputs.fedora_branch == 'rawhide' && 'rawhide' || format('f{0}', inputs.fedora_branch) }} for ${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # kmods/v4l2loopback is the one submodule left (extensions are
          # fetched by pin at build time)
          submodules: recursive

      # continue-on-error: most of what this removes is x86-only toolchain
      # that is simply absent on an arm runner, and a squeeze failure is
      # not a build failure -- running out of space later fails loudly on
      # its own.
      - name: Maximize build space
        continue-on-error: true
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          # The matrix leg overrides the bluespin.env defaults
          echo "IMAGE_NAME=${{ inputs.platform }}" >> ${GITHUB_ENV}
          echo "IMAGE_DESC=${{ inputs.image_desc }}" >> ${GITHUB_ENV}
          echo "FEDORA_BRANCH=${{ inputs.fedora_branch }}" >> ${GITHUB_ENV}
          # The tag this leg publishes under: the branch, plus the arch
          # suffix on multi-arch branches (bluespin:45-amd64/-aarch64,
          # stitched into bluespin:45 by the manifest job)
          echo "IMAGE_TAG=${{ inputs.fedora_branch }}${{ inputs.tag_suffix }}" >> ${GITHUB_ENV}

      # The Secure Boot signing key for the surface kernel, as a podman build
      # secret. Absent (e.g. a PR from a fork, where secrets do not exist) the
      # build still works and warns; publishing only happens from main, where
      # the secret is present.
      - name: Stage the Secure Boot signing key
        env:
          SECUREBOOT_KEY: ${{ secrets.SECUREBOOT_KEY }}
        run: |
          if [[ -n "${SECUREBOOT_KEY}" ]]; then
            printf '%s' "${SECUREBOOT_KEY}" > "${RUNNER_TEMP}/secureboot.key"
            echo "SECUREBOOT_KEY_FILE=${RUNNER_TEMP}/secureboot.key" >> "${GITHUB_ENV}"
          fi

      # On pushes, a variant builds FROM the bluespin image the bluespin job
      # just published, skipping the bluespin rebuild entirely. PRs publish
      # nothing, so their variant legs chain from the bluespin stage inside
      # the Containerfile instead (self-contained, same coverage). just
      # build picks BLUESPIN_IMAGE up from the environment.
      - name: Resolve the bluespin image
        if: inputs.from_bluespin && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          ref="${IMAGE_REGISTRY}/bluespin:${FEDORA_BRANCH}${{ inputs.bluespin_tag_suffix }}"
          digest="$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://${ref}")"
          echo "BLUESPIN_IMAGE=${ref}@${digest}" >> "${GITHUB_ENV}"

      # PR-side inheritance, the twin of the Resolve step above: download
      # the bluespin image the base leg built -- from this run, or the
      # finished run the plan found already covering the base -- load it,
      # and build FROM it. just build picks BLUESPIN_IMAGE up from the
      # environment either way.
      - name: Fetch the base image from its leg
        if: inputs.from_image_artifact != '' && github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.from_image_artifact }}
          path: /tmp/base-image
          run-id: ${{ inputs.from_image_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Load the base image
        if: inputs.from_image_artifact != '' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          loaded="$(podman load -q -i /tmp/base-image/shared-image.oci | sed -n 's/^Loaded image[^:]*: //p' | head -1)"
          rm -rf /tmp/base-image
          [[ -n "${loaded}" ]] || { echo "::error::podman load reported no image"; exit 1; }
          echo "BLUESPIN_IMAGE=${loaded}" >> "${GITHUB_ENV}"

      # This actually builds the container image, tagged with the branch
      - name: Build Image
        id: build-image
        run: |
          just build \
            "${IMAGE_NAME}" \
            "${FEDORA_BRANCH}"
          # just tags by branch; a suffixed leg republishes under its own tag
          if [[ "${IMAGE_TAG}" != "${FEDORA_BRANCH}" ]]; then
            podman tag "${IMAGE_NAME}:${FEDORA_BRANCH}" "${IMAGE_NAME}:${IMAGE_TAG}"
          fi

      # This provides smaller delta updates, using the distro-agnostic
      # rechunker: https://github.com/coreos/chunkah
      #
      # Every leg rechunks, the chained variants included. Rechunking a
      # chained variant does re-slice the bluespin layers it was built
      # FROM (measured: a rechunked dx keeps 34 of bluespin's 128 chunks,
      # ~30% of its bytes -- chunkah's packing is global, and there is no
      # base-preserving mode), but the alternative is worse where it
      # matters: an un-rechunked variant ships its whole delta as one
      # layer that re-uploads on every daily build (the rpmdb alone makes
      # it byte-unstable), while chunked images re-ship only the chunks
      # whose packages changed. Per-image update deltas are what clients
      # feel; the FROM-chain still saves the variant build from
      # rebuilding bluespin content.
      - name: Rechunk with Chunkah
        id: rechunk
        run: |
          just rechunk \
            "${IMAGE_NAME}" \
            "${IMAGE_TAG}"

      # Every PR leg shares its built image: dependent legs build FROM
      # it (the way pushes chain FROM the published digest), and the
      # follow-on workflows -- media, scanning, the GNOME report --
      # consume it. Post-rechunk, same as a publish would be.
      - name: Share the image with dependent legs
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          podman save --format oci-archive -o /tmp/shared-image.oci "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Upload the shared image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ inputs.platform }}-${{ inputs.fedora_branch }}${{ inputs.tag_suffix }}
          path: /tmp/shared-image.oci
          # Chunked layers are already gzip; a day outlives any PR run
          compression-level: 0
          retention-days: 1

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        "${IMAGE_NAME}" \
                        "${IMAGE_TAG}")"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push once, then add every alias server-side. Pushing the same local
      # image once per tag does not guarantee the same manifest digest, which
      # would leave all but the last tag unsigned; copying between registry
      # refs reuses the manifest, so every alias shares the one digest that is
      # signed below.
      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          podman push --digestfile=/tmp/digestfile \
            "${IMAGE_NAME}:${IMAGE_TAG}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

          digest=$(< /tmp/digestfile)

          for tag in ${ALIAS_TAGS}; do
            [[ "${tag}" == "${IMAGE_TAG}" ]] && continue
            skopeo copy \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # Every alias must resolve to the digest about to be signed, and the
      # published manifest must have the architecture this leg exists to
      # build -- a runner or podman change that silently produced amd64
      # would otherwise ship a phone image that cannot boot on the device.
      # Fail after publishing but before signing rather than leave a tag
      # unsigned.
      - name: Verify the published tags
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
          EXPECT_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          for tag in ${ALIAS_TAGS}; do
            out="$(skopeo inspect --no-tags --format '{{.Digest}} {{.Architecture}}' \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}")"
            got="${out%% *}"
            arch="${out##* }"
            [[ "${got}" == "${DIGEST}" ]] || {
              echo "::error::${IMAGE_NAME}:${tag} is ${got}, expected ${DIGEST}"
              exit 1
            }
            [[ "${arch}" == "${EXPECT_ARCH}" ]] || {
              echo "::error::${IMAGE_NAME}:${tag} is ${arch}, expected ${EXPECT_ARCH}"
              exit 1
            }
          done
