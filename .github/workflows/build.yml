---
# Every platform on every Fedora branch: the matrix below is
# platform (bluespin, bluespin-dx, bluespin-surface) x fedora_branch. The
# branch is the image tag -- bluespin:44, bluespin-dx:rawhide -- and the
# default branch (DEFAULT_FEDORA_BRANCH in bluespin.env) also carries `latest`
# and the dated tags it always had, so nothing following `bluespin:latest`
# changes. Each branch's base is pinned in bluespin.env; 44 builds on Bluefin,
# the rest on Fedora's own Silverblue, and build.sh supplies what that base
# lacks.
#
# A dispatch can name the branches to build, which is how a leg that is not
# in the regular list gets built by hand.
name: Build Bluespin container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 07 * * *'  # 07:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
    inputs:
      fedora_branches:
        description: 'Fedora branches to build, as a JSON array'
        type: string
        required: false
        default: '["44", "45", "rawhide"]'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    # f44 / rawhide -- not frawhide
    name: ${{ matrix.platform }} on ${{ matrix.fedora_branch == 'rawhide' && 'rawhide' || format('f{0}', matrix.fedora_branch) }}
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - bluespin
          - bluespin-dx
          - bluespin-surface
        # The branches every run builds and, on main, publishes. Trim this list
        # to choose the legs that run in CI; a dispatch can ask for any other.
        fedora_branch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.fedora_branches || '["44", "45", "rawhide"]') }}
        include:
          - platform: bluespin
            image_desc: "Bluespin"
          - platform: bluespin-dx
            image_desc: "Bluespin DX"
          - platform: bluespin-surface
            image_desc: "Bluespin for Microsoft Surface devices"

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GNOME Shell extensions Fedora does not package are vendored in extensions/
          submodules: recursive

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          # The matrix leg overrides the bluespin.env defaults
          echo "IMAGE_NAME=${{ matrix.platform }}" >> ${GITHUB_ENV}
          echo "IMAGE_DESC=${{ matrix.image_desc }}" >> ${GITHUB_ENV}
          echo "FEDORA_BRANCH=${{ matrix.fedora_branch }}" >> ${GITHUB_ENV}

      # This actually builds the container image, tagged with the branch
      - name: Build Image
        id: build-image
        run: |
          just build \
            "${IMAGE_NAME}" \
            "${FEDORA_BRANCH}"

      # This provides smaller delta updates, using the distro-agnostic
      # rechunker: https://github.com/coreos/chunkah
      - name: Rechunk with Chunkah
        id: rechunk
        run: |
          just rechunk \
            "${IMAGE_NAME}" \
            "${FEDORA_BRANCH}"

      # What every installed extension declares against the shell this image
      # ships. This is the visibility mechanism for installed-but-disabled
      # extensions, whose shell coverage is deliberately not a hard build gate
      # -- only what a platform enables is, see assert_enabled_extensions in
      # build_files/extensions.sh. Informational: must never block the build.
      - name: Report GNOME compatibility
        if: always()
        continue-on-error: true
        run: |
          podman run --rm \
            -v "${PWD}/.github/scripts/report-extensions.sh:/tmp/report.sh:ro,Z" \
            --entrypoint bash "${IMAGE_NAME}:${FEDORA_BRANCH}" /tmp/report.sh \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        "${IMAGE_NAME}" \
                        "${FEDORA_BRANCH}")"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push once, then add every alias server-side. Pushing the same local
      # image once per tag does not guarantee the same manifest digest, which
      # would leave all but the last tag unsigned; copying between registry
      # refs reuses the manifest, so every alias shares the one digest that is
      # signed below.
      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          podman push --digestfile=/tmp/digestfile \
            "${IMAGE_NAME}:${FEDORA_BRANCH}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${FEDORA_BRANCH}"

          digest=$(< /tmp/digestfile)

          for tag in ${ALIAS_TAGS}; do
            [[ "${tag}" == "${FEDORA_BRANCH}" ]] && continue
            skopeo copy \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # Every alias must resolve to the digest about to be signed; fail after
      # publishing but before signing rather than leave a tag unsigned.
      - name: Verify the published tags
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          for tag in ${ALIAS_TAGS}; do
            got="$(skopeo inspect --no-tags --format '{{.Digest}}' \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}")"
            [[ "${got}" == "${DIGEST}" ]] || {
              echo "::error::${IMAGE_NAME}:${tag} is ${got}, expected ${DIGEST}"
              exit 1
            }
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.3'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
