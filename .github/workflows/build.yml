---
# The bluespin family as layered builds: the bluespin job builds and
# publishes the image of that name -- every branch on pushes and the
# nightly, rawhide included as the early-warning leg -- then the variant
# jobs build bluespin-dx and bluespin-surface on the branched releases
# FROM that published image, so a variant build on main never rebuilds
# the bluespin content. On pull requests nothing is published, every leg
# builds self-contained from the Containerfile's own stages (no
# ordering), and only the branched releases build: a rawhide leg red for
# rawhide reasons would just block unrelated merges.
#
# The branch is the image tag -- bluespin:44, bluespin-dx:rawhide -- and the
# default branch (DEFAULT_FEDORA_BRANCH in bluespin.env) also carries
# `latest` and the dated tags it always had. Each branch's base is pinned in
# bluespin.env. A dispatch can name the branches to build, which is how a
# leg that is not in the regular list gets built by hand.
name: Build Bluespin container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 07 * * *'  # 07:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
    inputs:
      fedora_branches:
        description: 'Fedora branches to build, as a JSON array'
        type: string
        required: false
        default: '["44", "45", "rawhide"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluespin:
    name: bluespin (${{ matrix.fedora_branch }})
    strategy:
      fail-fast: false
      matrix:
        # Pushes and the nightly build every branch, rawhide included --
        # the early-warning leg. Pull requests build the branched releases
        # only. A dispatch can ask for any list.
        fedora_branch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.fedora_branches || (github.event_name == 'pull_request' && '["44", "45"]' || '["44", "45", "rawhide"]')) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/build-image.yml
    with:
      platform: bluespin
      fedora_branch: ${{ matrix.fedora_branch }}
      image_desc: "Bluespin"
    secrets: inherit

  variants:
    name: ${{ matrix.platform }} (${{ matrix.fedora_branch }})
    needs: bluespin
    # The bluespin caller job reports failure if ANY job in the called
    # workflow fails -- the attest job included, whose failures are
    # typically an external service flaking after the image already
    # published (the first main run lost its 45 variants to exactly that:
    # a Rekor 502 during attest). On pushes the variants' own Resolve step
    # is the real gate -- no published bluespin digest, no leg -- so
    # attempt them unless the run was cancelled. On pull requests the legs
    # are self-contained and would only replay the same build failure, so
    # the hard gate stays.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.bluespin.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - bluespin-dx
          - bluespin-surface
        # The branched releases only: rawhide is the bluespin image's
        # early-warning leg (the GNOME and extension asserts run there),
        # and the variants add no rawhide-specific signal -- the surface
        # kernel rebase trails mainline rc by construction. A dispatch can
        # still ask for a variant rawhide leg by hand.
        fedora_branch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.fedora_branches || '["44", "45"]') }}
        include:
          - platform: bluespin-dx
            image_desc: "Bluespin DX"
          - platform: bluespin-surface
            image_desc: "Bluespin for Microsoft Surface devices"
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/build-image.yml
    with:
      platform: ${{ matrix.platform }}
      fedora_branch: ${{ matrix.fedora_branch }}
      image_desc: ${{ matrix.image_desc }}
      from_bluespin: true
    secrets: inherit
