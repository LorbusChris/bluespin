---
# Sign what the build run published: every instance digest the plan
# names, and the branch indexes the manifest job stitched -- keyed (what
# on-device policy enforces) and keyless (the workflow identity),
# together the equivalent of `cosign sign --recursive`. One concern per
# workflow: build.yml publishes, this signs, on the build run's
# completion. The published images live unsigned for the minutes in
# between, which on-device policy tolerates by retrying its next update.
#
# Runs even when the build run partially failed: the legs that DID
# publish must not stay unsigned, so every tag is resolved individually
# and a missing one is a warning, not a failure.
name: Sign Bluespin images
on:
  workflow_run:
    workflows:
      - Build Bluespin container image
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  sign:
    name: sign
    if: ${{ github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    env:
      IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
    steps:
      # For .github/scripts/retry.sh
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the build run's plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.3'

      - name: Sign every published digest
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          reg="${IMAGE_REGISTRY,,}"

          sign_ref() { # sign_ref <name>:<tag>
            local digest
            if ! digest="$(skopeo inspect --no-tags --format '{{.Digest}}' \
                "docker://${reg}/$1" 2>/dev/null)"; then
              echo "::warning::${1} did not resolve -- its leg did not publish; skipping"
              return 0
            fi
            # A digest we already signed stays signed: re-signing daily
            # would only accrete duplicate signature layers, and a tag
            # that no default leg rebuilds (rawhide between opt-in
            # builds) serves the same digest for weeks
            if cosign verify --key cosign.pub "${reg}/${1%%:*}@${digest}" > /dev/null 2>&1; then
              echo "${1}@${digest} already signed; skipping"
              return 0
            fi
            # Keyed then keyless; retried, same Rekor reasoning as
            # retry.sh explains
            .github/scripts/retry.sh 3 30 \
              cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${reg}/${1%%:*}@${digest}"
            .github/scripts/retry.sh 3 30 \
              cosign sign -y --new-bundle-format=false --use-signing-config=false "${reg}/${1%%:*}@${digest}"
          }

          # The instance digests, straight from the plan's leg lists
          for leg in $(jq -r '.bluespin[] | "bluespin:\(.fedora_branch)-\(.arch)"' plan.json); do
            sign_ref "${leg}"
          done
          for leg in $(jq -r '.dx[] | "bluespin-dx:\(.fedora_branch)"' plan.json); do
            sign_ref "${leg}"
          done
          for leg in $(jq -r '.surface[] | "bluespin-surface:\(.fedora_branch)"' plan.json); do
            sign_ref "${leg}"
          done
          for leg in $(jq -r '.fp5[] | "bluespin-fp5:\(.fedora_branch)"' plan.json); do
            sign_ref "${leg}"
          done

          # The branch indexes the manifest job stitched; the floating
          # aliases point at these same digests, so one signature covers
          # them all
          for branch in 44 45 rawhide; do
            sign_ref "bluespin:${branch}"
          done
