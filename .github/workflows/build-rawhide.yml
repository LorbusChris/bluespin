---
# EXPERIMENTAL. Manual only -- no cron, no push trigger. This builds bluespin's
# additions on Fedora rawhide to find out what breaks on the next GNOME.
# A successful build is published and signed like the shipping variants, but
# under its own `bluespin-rawhide` name and tags, so nothing here can overwrite
# them. A failed build publishes nothing.
name: Build Bluespin rawhide (experimental)
on:
  workflow_dispatch:

env:
  IMAGE_NAME: bluespin-rawhide
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_rawhide:
    name: Build rawhide image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}

      - name: Build Image
        run: |
          just build-rawhide

      # Same delta-friendly layering as the shipping variants
      - name: Rechunk with Chunkah
        run: |
          just rechunk ${IMAGE_NAME} latest

      # The reason this workflow exists: report what every extension declares
      # against the shell the image actually shipped
      - name: Report GNOME compatibility
        if: always()
        run: |
          set -euo pipefail
          podman run --rm --entrypoint bash ${IMAGE_NAME}:latest -c '
            echo "## GNOME $(rpm -q --qf "%{version}" gnome-shell) (Fedora $(rpm -E %fedora))"
            echo
            echo "| Extension | shell-version |"
            echo "| --- | --- |"
            for d in /usr/share/gnome-shell/extensions/*/; do
              [ -f "$d/metadata.json" ] || continue
              jq -r --arg u "$(basename "$d")" \
                "\"| \($u) | \(.[\"shell-version\"] | join(\", \")) |\"" "$d/metadata.json"
            done
          ' >> "$GITHUB_STEP_SUMMARY"

      # Publishing only happens once the build and rechunk have succeeded.
      # Tags are rawhide-specific, so this can never overwrite a shipping tag.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        id: push-image
        run: |
          set -euox pipefail
          DATE="$(date +%Y%m%d)"
          for tag in rawhide "rawhide-${DATE}"; do
            podman push --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:latest" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.3'

      - name: Sign container image
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
