---
# EXPERIMENTAL. Manual only -- no cron, no push trigger. This builds bluespin's
# additions on Fedora rawhide to find out what breaks on the next GNOME, and
# deliberately does not publish: a red build here is a result, not an outage.
name: Build Bluespin rawhide (experimental)
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_rawhide:
    name: Build rawhide image
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build Image
        run: |
          just build-rawhide

      # The reason this workflow exists: report what every extension declares
      # against the shell the image actually shipped
      - name: Report GNOME 51 compatibility
        if: always()
        run: |
          set -euo pipefail
          podman run --rm --entrypoint bash localhost/bluespin-rawhide:latest -c '
            echo "## GNOME $(rpm -q --qf "%{version}" gnome-shell) (Fedora $(rpm -E %fedora))"
            echo
            echo "| Extension | shell-version |"
            echo "| --- | --- |"
            for d in /usr/share/gnome-shell/extensions/*/; do
              [ -f "$d/metadata.json" ] || continue
              jq -r --arg u "$(basename "$d")" \
                "\"| \($u) | \(.[\"shell-version\"] | join(\", \")) |\"" "$d/metadata.json"
            done
          ' >> "$GITHUB_STEP_SUMMARY"
