---
# Flashable disk images for the Fairphone 5, built from a published
# bluespin-fp5 container.
#
# Install media are release moments: the daily builds publish only the OCI
# images existing devices update from, and this ~10 GiB job runs when a
# GitHub release is published -- the artifact lands on that release -- or
# by hand. One f45 release builds the first flashable image; every build
# after it is an update, not an installation. Releases are per Fedora
# branch, and only a release whose branch bluespin-fp5 actually publishes
# gets a disk image: a 44 release skips this with a notice instead of
# attaching a 45 phone image to it. Pull requests do not come through
# here: a PR has no published tag to pull.
name: Build Disk
on:
  release:
    types:
      - published
  # A pull-request *-disk label: the build workflow shares the fp5
  # leg's image as an artifact, and this fires when that run completes
  # to build the flashable image from it
  workflow_run:
    workflows:
      - Build
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'bluespin-fp5 tag to build from'
        type: string
        required: true
        default: '45'
      release_tag:
        description: 'optional release (by tag) to upload the archive to'
        type: string
        required: false
  # release.yml calls this to build a pre-release's disk image onto it
  # before promoting -- it cannot go through the release event, which a
  # GITHUB_TOKEN-created release never fires
  workflow_call:
    inputs:
      tag:
        description: 'bluespin-fp5 tag to build from'
        type: string
        required: true
      release_tag:
        description: 'release (by tag) to upload the archive to'
        type: string
        required: false

env:
  IMAGE_NAME: bluespin-fp5
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  # The file's own name as a literal, not github.workflow: under
  # workflow_call that context names the CALLER, and the release
  # workflow's two media calls must not land in one group and cancel
  # each other
  group: build-disk-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # A release names its branch in its tag ("45.0" -> 45); a dispatch
  # names the tag directly. Whether that branch has a phone image is the
  # registry's call: the ~10 GiB build below runs only when
  # bluespin-fp5:<tag> resolves.
  plan-release:
    name: plan (release)
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.map.outputs.tag }}
      build: ${{ steps.map.outputs.build }}
    steps:
      - name: Resolve the tag
        id: map
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          reg="${IMAGE_REGISTRY,,}"
          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="$(grep -oE '4[0-9]|rawhide' <<< "${RELEASE_TAG}" | head -1 || true)"
            tag="${tag:-45}"
          fi
          if skopeo inspect --no-tags --format '{{.Digest}}' \
              "docker://${reg}/${IMAGE_NAME}:${tag}" > /dev/null 2>&1; then
            build=true
          else
            build=false
            echo "::notice::${IMAGE_NAME}:${tag} is not published; this release ships no FP5 disk image"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "build=${build}" >> "$GITHUB_OUTPUT"

  disk:
    name: bluespin-fp5 (disk)
    needs: plan-release
    if: ${{ github.event_name != 'workflow_run' && needs.plan-release.outputs.build == 'true' }}
    # 24.04, NOT 26.04. pocketblue moved every job to 26.04-arm and then moved
    # the disk-image job specifically back (pocketblue d729297); the container
    # jobs stayed. Do not rediscover that.
    runs-on: ubuntu-24.04-arm

    permissions:
      # write, not read: the optional release-asset upload at the end attaches
      # the archive to a release, which needs it -- with read the whole job
      # succeeds and then 403s on the final step.
      contents: write

    steps:
      # No submodules: this job never builds the container, it pulls one.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Peak disk here is the pulled image plus disk.raw plus the split rootfs.
      # Most of what this removes is x86-only toolchain absent on an arm runner.
      - name: Maximize build space
        continue-on-error: true
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # The input goes through env, not ${{ }} interpolation inside the
      # script: a crafted tag would otherwise inject shell into the run block.
      # The heredoc write keeps a newline-carrying value contained to one
      # output instead of appending extra name=value lines to GITHUB_OUTPUT.
      - name: Resolve the image reference
        id: ref
        env:
          TAG: ${{ needs.plan-release.outputs.tag }}
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          {
            echo "image_ref<<__EOV__"
            echo "${IMAGE_REGISTRY,,}/${IMAGE_NAME}:${TAG}"
            echo "__EOV__"
          } >> "${GITHUB_OUTPUT}"

      # Must be sudo: image-builder resolves the ref from root's container
      # storage. A rootless pull puts the image where it cannot be seen.
      - name: Pull the container image
        env:
          DISK_IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
        run: sudo podman pull "${DISK_IMAGE_REF}"

      - name: Build, verify and archive the disk image
        uses: ./.github/actions/fp5-disk-image
        with:
          image-ref: ${{ steps.ref.outputs.image_ref }}
          artifact-suffix: ${{ needs.plan-release.outputs.tag }}

      # gh, not an upload action: the actions that take a release id
      # PATCH the release as they attach to it, and one of them publishing
      # a draft is how 45.20260825.1 went public with only a phone image
      # on it while its installers were still failing. `gh release upload`
      # touches assets and nothing else, drafts included.
      - name: Upload release artifact
        # A release event names its own release; a call or dispatch can
        # name one
        if: ${{ inputs.release_tag || github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          ARCHIVE: ${{ env.IMAGE_NAME }}-${{ needs.plan-release.outputs.tag }}.7z
        run: |
          set -euo pipefail
          # 1.8 GiB today, against a 2 GiB asset limit -- the script
          # attaches it in parts on the day it stops fitting
          .github/scripts/upload-release-asset.sh "${RELEASE_TAG}" "${ARCHIVE}"

  # The pull-request path: read the completed build run's plan and build
  # the flashable image from the fp5 leg's shared artifact. Loaded with
  # sudo, straight into the root storage image-builder resolves from.
  plan-pr:
    name: plan (pr)
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      legs: ${{ steps.map.outputs.legs }}
      pr: ${{ steps.map.outputs.pr }}
    steps:
      - name: Download the build run's plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Map disk flags to legs
        id: map
        run: |
          set -euo pipefail
          legs='[]'
          for key in $(jq -r '.fp5_disk[]' plan.json); do
            branch="${key%-*}"
            legs="$(jq -c ". + [{\"fedora_branch\":\"${branch}\"}]" <<< "${legs}")"
          done
          {
            echo "legs=${legs}"
            echo "pr=$(jq -r .pr plan.json)"
          } | tee -a "$GITHUB_OUTPUT"

  # No name: -- a matrix name template renders raw in the checks list
  # whenever the job is skipped, so the leg carries the display:
  # pr-disk (45). The commit status below is what the pull request sees,
  # and it keeps the family's full name.
  pr-disk:
    needs: plan-pr
    if: ${{ needs.plan-pr.outputs.legs != '[]' }}
    # 24.04, NOT 26.04 -- see the note on the disk job above
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-pr.outputs.legs) }}
    steps:
      # workflow_run runs never appear on the pull request's checks;
      # a commit status on the head SHA does, and links here
      - name: Report building (commit status)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONTEXT: bluespin-fp5 (${{ matrix.fedora_branch }}, disk)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=pending -f context="${CONTEXT}" \
            -f target_url="${RUN_URL}" -f description="building"

      # For tools/, devices/ and the composite action
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        continue-on-error: true
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Fetch the fp5 leg's image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-bluespin-fp5-${{ matrix.fedora_branch }}
          path: /tmp/fp5-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Not the acquire-image action: image-builder resolves the ref
      # from ROOT's container storage, so the load must be sudo
      - name: Load the image into root storage
        id: load
        run: |
          set -euo pipefail
          ref="$(sudo podman load -q -i /tmp/fp5-image/shared-image.oci | sed -n 's/^Loaded image[^:]*: //p' | head -1)"
          rm -rf /tmp/fp5-image
          [[ -n "${ref}" ]] || { echo "::error::podman load reported no image"; exit 1; }
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Build, verify and archive the disk image
        uses: ./.github/actions/fp5-disk-image
        with:
          image-ref: ${{ steps.load.outputs.ref }}
          artifact-suffix: pr-${{ needs.plan-pr.outputs.pr }}

      - name: Report built (commit status)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONTEXT: bluespin-fp5 (${{ matrix.fedora_branch }}, disk)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=success -f context="${CONTEXT}" \
            -f target_url="${RUN_URL}" -f description="flashable image in this run's artifacts"

      - name: Report failed (commit status)
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONTEXT: bluespin-fp5 (${{ matrix.fedora_branch }}, disk)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=failure -f context="${CONTEXT}" \
            -f target_url="${RUN_URL}" -f description="failed"
