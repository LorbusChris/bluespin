---
name: Build Bluespin ISOs
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_iso:
    name: Build live ISO
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        image_name:
          - bluespin
          - bluespin-dx
          - bluespin-surface
          # bluespin-fp5 is deliberately absent. A live installer ISO is
          # meaningless for a phone that is flashed with fastboot, and this job
          # is x86-only (see the -live-amd64 names below).

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      # Builds a live ISO directly from the published bootc image; the
      # container-native ISO contract layer comes from the bluefin base
      - name: Build ISO with Titanoboa
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: ghcr.io/lorbuschris/${{ matrix.image_name }}:latest
          iso-dest: ${{ github.workspace }}/${{ matrix.image_name }}-live-amd64.iso

      - name: Checksum ISO
        shell: bash
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          (cd "$(dirname "${ISO_PATH}")" && sha256sum "$(basename "${ISO_PATH}")" | tee "$(basename "${ISO_PATH}")-CHECKSUM")

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.image_name }}-live-amd64
          path: |
            ${{ steps.build.outputs.iso-dest }}
            ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          compression-level: 0
          retention-days: 7
