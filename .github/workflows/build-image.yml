---
# One image build+publish leg, called per platform x branch by build.yml --
# the bluespin job first, then the variant jobs that layer on its published
# image. Everything that was the old single-job body lives here unchanged.
name: Build one bluespin image
on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      fedora_branch:
        type: string
        required: true
      image_desc:
        type: string
        required: true
      from_bluespin:
        description: 'Layer on the published bluespin image (pushes only)'
        type: boolean
        default: false

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

jobs:
  build_push:
    # f44 / rawhide -- not frawhide
    name: ${{ inputs.platform }} on ${{ inputs.fedora_branch == 'rawhide' && 'rawhide' || format('f{0}', inputs.fedora_branch) }}
    runs-on: ubuntu-24.04
    outputs:
      # For the attest job: the digest the push produced (empty on PRs,
      # where nothing is pushed and the attest job does not run)
      digest: ${{ steps.push-image.outputs.digest }}

    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # kmods/v4l2loopback is the one submodule left (extensions are
          # fetched by pin at build time)
          submodules: recursive

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          # The matrix leg overrides the bluespin.env defaults
          echo "IMAGE_NAME=${{ inputs.platform }}" >> ${GITHUB_ENV}
          echo "IMAGE_DESC=${{ inputs.image_desc }}" >> ${GITHUB_ENV}
          echo "FEDORA_BRANCH=${{ inputs.fedora_branch }}" >> ${GITHUB_ENV}

      # The Secure Boot signing key for the surface kernel, as a podman build
      # secret. Absent (e.g. a PR from a fork, where secrets do not exist) the
      # build still works and warns; publishing only happens from main, where
      # the secret is present.
      - name: Stage the Secure Boot signing key
        env:
          SECUREBOOT_KEY: ${{ secrets.SECUREBOOT_KEY }}
        run: |
          if [[ -n "${SECUREBOOT_KEY}" ]]; then
            printf '%s' "${SECUREBOOT_KEY}" > "${RUNNER_TEMP}/secureboot.key"
            echo "SECUREBOOT_KEY_FILE=${RUNNER_TEMP}/secureboot.key" >> "${GITHUB_ENV}"
          fi

      # On pushes, a variant builds FROM the bluespin image the bluespin job
      # just published, skipping the bluespin rebuild entirely. PRs publish
      # nothing, so their variant legs chain from the bluespin stage inside
      # the Containerfile instead (self-contained, same coverage). just
      # build picks BLUESPIN_IMAGE up from the environment.
      - name: Resolve the bluespin image
        if: inputs.from_bluespin && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          digest="$(skopeo inspect --no-tags --format '{{.Digest}}' \
            "docker://${IMAGE_REGISTRY}/bluespin:${FEDORA_BRANCH}")"
          echo "BLUESPIN_IMAGE=${IMAGE_REGISTRY}/bluespin:${FEDORA_BRANCH}@${digest}" >> "${GITHUB_ENV}"

      # This actually builds the container image, tagged with the branch
      - name: Build Image
        id: build-image
        run: |
          just build \
            "${IMAGE_NAME}" \
            "${FEDORA_BRANCH}"

      # This provides smaller delta updates, using the distro-agnostic
      # rechunker: https://github.com/coreos/chunkah
      #
      # Every leg rechunks, the chained variants included. Rechunking a
      # chained variant does re-slice the bluespin layers it was built
      # FROM (measured: a rechunked dx keeps 34 of bluespin's 128 chunks,
      # ~30% of its bytes -- chunkah's packing is global, and there is no
      # base-preserving mode), but the alternative is worse where it
      # matters: an un-rechunked variant ships its whole delta as one
      # layer that re-uploads on every daily build (the rpmdb alone makes
      # it byte-unstable), while chunked images re-ship only the chunks
      # whose packages changed. Per-image update deltas are what clients
      # feel; the FROM-chain still saves the variant build from
      # rebuilding bluespin content.
      - name: Rechunk with Chunkah
        id: rechunk
        run: |
          just rechunk \
            "${IMAGE_NAME}" \
            "${FEDORA_BRANCH}"

      # SBOM for the image that ships, with the very syft the dx image
      # offers as a podman function -- the digest pin in
      # files/etc/profile.d/97-bluespin-container-clis.sh is the one
      # Renovate-tracked source for both. Generating it is the only part
      # that needs the local image; everything downstream -- grype and the
      # attestation -- reads the SBOM, so those run as their own jobs on
      # the artifact uploaded below and never hold up this one.
      #
      # Package-level on purpose: syft's raw SPDX for an OS image is
      # ~109 MB, ~90% of it the ~118k per-file entries the rpmdb owns,
      # and as a DSSE payload that is a ~146 MB POST that Rekor's gateway
      # refuses with a bare 502 -- deterministically, which is what failed
      # every attest before this (the same attestation with the file
      # inventory stripped is ~28 MB on the wire and accepted in seconds;
      # both reproduced). grype matches on packages either way: ~8k
      # packages with versions and licenses ARE the useful inventory, and
      # per-file digests of a distro image were noise that made the
      # attestation undeliverable. The jq keeps the document
      # self-consistent: no relationship may reference a stripped entry.
      #
      # One scan, two documents. SPDX is the standard the world can
      # consume, so it is what gets attested -- but it has no field for
      # Go function symbols, which grype needs to match Go binaries at
      # function rather than module granularity (without them a stdlib
      # CVE flags every Go binary whether or not it calls the affected
      # function -- measured on this image: 92 of 330 findings were that
      # noise). So the same scan also emits syft's native format with
      # symbols captured, for the vulnerability-report job only: never
      # attested, files stripped likewise, and zip takes care of the
      # symbol bulk on the way into the artifact.
      - name: Generate SBOM
        id: sbom
        run: |
          set -euo pipefail
          syft_image="$(sed -n 's/^SYFT_IMAGE=//p' files/etc/profile.d/97-bluespin-container-clis.sh)"
          podman save --format oci-archive -o /tmp/image.oci "${IMAGE_NAME}:${FEDORA_BRANCH}"
          podman run --rm -e SYFT_GOLANG_CAPTURE_SYMBOLS=all \
            -v /tmp/image.oci:/image.oci:ro -v "${PWD}:/out" "${syft_image}" \
            scan oci-archive:/image.oci \
            -o spdx-json=/out/sbom.full.json \
            -o syft-json=/out/sbom.syft.full.json
          # externalRefs: keep each package's purl, drop syft's generated
          # CPE guesses -- they are heuristic, every serious consumer keys
          # on the purl, and on the dx image they alone were ~9 MB: the
          # difference between an attestation Rekor accepts and the 502
          # its gateway returns above roughly 32 MiB on the wire (bluespin
          # at ~29 MB passed, dx at ~38 MB failed, same day same code).
          jq '
            .files = []
            | ([.SPDXID] + (.packages | map(.SPDXID)) | map({(.): true}) | add) as $keep
            | .relationships = [.relationships[]
                | select($keep[.spdxElementId] and $keep[.relatedSpdxElement])]
            | .packages = [.packages[]
                | if .externalRefs then .externalRefs = [.externalRefs[] | select(.referenceType == "purl")] else . end
                | if .externalRefs == [] then del(.externalRefs) else . end]
          ' sbom.full.json > sbom.spdx.json
          # Same discipline as the SPDX above: stripping the files must
          # take every relationship that referenced them along, or grype's
          # decoder warns once per dangling reference (hundreds per image)
          jq '
            .files = []
            | ([.source.id] + [.artifacts[].id] | map({(.): true}) | add) as $keep
            | .artifactRelationships = [.artifactRelationships[]
                | select($keep[.parent] and $keep[.child])]
          ' sbom.syft.full.json > sbom.syft.json
          rm -f /tmp/image.oci sbom.full.json sbom.syft.full.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.platform }}-${{ inputs.fedora_branch }}
          path: |
            sbom.spdx.json
            sbom.syft.json

      # What every installed extension declares against the shell this image
      # ships. This is the visibility mechanism for installed-but-disabled
      # extensions, whose shell coverage is deliberately not a hard build gate
      # -- only what a platform enables is, see assert_enabled_extensions in
      # build_files/extensions.sh. Informational: must never block the build.
      - name: Report GNOME compatibility
        if: always()
        continue-on-error: true
        run: |
          podman run --rm \
            -v "${PWD}/.github/scripts/report-extensions.sh:/tmp/report.sh:ro,Z" \
            --entrypoint bash "${IMAGE_NAME}:${FEDORA_BRANCH}" /tmp/report.sh \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        "${IMAGE_NAME}" \
                        "${FEDORA_BRANCH}")"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push once, then add every alias server-side. Pushing the same local
      # image once per tag does not guarantee the same manifest digest, which
      # would leave all but the last tag unsigned; copying between registry
      # refs reuses the manifest, so every alias shares the one digest that is
      # signed below.
      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          podman push --digestfile=/tmp/digestfile \
            "${IMAGE_NAME}:${FEDORA_BRANCH}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${FEDORA_BRANCH}"

          digest=$(< /tmp/digestfile)

          for tag in ${ALIAS_TAGS}; do
            [[ "${tag}" == "${FEDORA_BRANCH}" ]] && continue
            skopeo copy \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # Every alias must resolve to the digest about to be signed; fail after
      # publishing but before signing rather than leave a tag unsigned.
      - name: Verify the published tags
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          for tag in ${ALIAS_TAGS}; do
            got="$(skopeo inspect --no-tags --format '{{.Digest}}' \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}")"
            [[ "${got}" == "${DIGEST}" ]] || {
              echo "::error::${IMAGE_NAME}:${tag} is ${got}, expected ${DIGEST}"
              exit 1
            }
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.3'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          # retried: the tlog upload flakes when Rekor does (see retry.sh)
          .github/scripts/retry.sh 3 30 \
            cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      # Keyless too, additively: the same digest gets a second signature,
      # bound to this workflow's OIDC identity via a Fulcio certificate and
      # logged in Rekor (id-token: write above is what enables this).
      # Nothing verifies it on-device yet -- policy.json keeps enforcing the
      # key -- but signing both ways from today means a later switch to
      # keyless verification is a policy change, not a re-signing campaign
      # over every published image. Same legacy bundle format as the keyed
      # signature, so c/image can read these once that switch happens.
      - name: Sign container image (keyless)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          .github/scripts/retry.sh 3 30 \
            cosign sign -y --new-bundle-format=false --use-signing-config=false ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

  # The vulnerability report never needed the image: grype reads the SBOM
  # the build job uploaded. Report-only by design -- a distro image always
  # carries open RPM CVEs, so a gate would simply stay red -- and its own
  # job, so a scanner hiccup neither fails nor delays the build leg and a
  # rerun of it alone is cheap.
  vulnerability-report:
    name: vulnerability report
    needs: build_push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      # For the grype digest pin in files/etc/profile.d (same
      # Renovate-tracked source as the dx podman function)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ inputs.platform }}-${{ inputs.fedora_branch }}

      # The syft-native document, not the attested SPDX: it carries the Go
      # function symbols that let grype match at function granularity --
      # 92 of 330 findings on this image were module-level false
      # positives without them.
      - name: Vulnerability report
        run: |
          set -euo pipefail
          grype_image="$(sed -n 's/^GRYPE_IMAGE=//p' files/etc/profile.d/97-bluespin-container-clis.sh)"
          podman run --rm -v "${PWD}/sbom.syft.json:/sbom.json:ro" "${grype_image}" \
            sbom:/sbom.json -o json > grype.json
          podman run --rm -v "${PWD}/sbom.syft.json:/sbom.json:ro" "${grype_image}" \
            sbom:/sbom.json -o sarif > grype.sarif
          {
            echo "### Vulnerabilities: ${{ inputs.platform }}:${{ inputs.fedora_branch }}"
            echo ""
            echo "| Severity | Count |"
            echo "| --- | --- |"
            jq -r '[.matches[].vulnerability.severity] | group_by(.) | map({(.[0]): length}) | add // {} | to_entries[] | "| \(.key) | \(.value) |"' grype.json
            echo ""
            echo "$(jq '[.matches[] | select(.vulnerability.fix.state == "fixed")] | length' grype.json) with a fix available upstream."
          } >> "$GITHUB_STEP_SUMMARY"

      # Into the repository's code-scanning view, one category per leg.
      # Push events only: fork PRs lack the permission, and main is the
      # state worth tracking.
      - name: Upload vulnerability report to code scanning
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: grype.sarif
          category: grype-${{ inputs.platform }}-${{ inputs.fedora_branch }}

  # The SBOM travels with the image: attached to the published digest as an
  # attestation, keyed (what policy could one day verify) and keyless
  # (workflow identity), same dual story as the signatures. Its own job
  # because it talks to two external services (the registry and Rekor) after
  # the image is already published and signed: a flake here must not read as
  # a failed build.
  attest:
    name: attest SBOM
    needs: build_push
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
    steps:
      # For .github/scripts/retry.sh
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ inputs.platform }}-${{ inputs.fedora_branch }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.3'

      - name: Attest SBOM
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ needs.build_push.outputs.digest }}
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          ref="${IMAGE_REGISTRY,,}/${{ inputs.platform }}@${DIGEST}"
          .github/scripts/retry.sh 3 30 \
            cosign attest -y --key env://COSIGN_PRIVATE_KEY \
            --predicate sbom.spdx.json --type spdxjson "${ref}"
          .github/scripts/retry.sh 3 30 \
            cosign attest -y \
            --predicate sbom.spdx.json --type spdxjson "${ref}"
