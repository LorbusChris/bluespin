---
# bluespin for the Fairphone 5 (aarch64).
#
# Manual and weekly rather than nightly: the sc7280 kernel COPR moves on its own
# schedule and there is no point rebuilding a phone image nightly that nobody
# flashes nightly.
#
# Matrix over Fedora branch WITH fail-fast disabled, because the two legs are
# expected to behave differently: @mobility/gnome-mobile publishes a mobile
# gnome-shell for rawhide and nothing for f44, so the f44 leg fails on purpose.
# The first job step checks the COPR's repodata before checkout or any image
# pull, so that leg costs seconds of runner time; build_fp5.sh carries the same
# gate as an in-build backstop. It is left visibly red rather than masked with
# continue-on-error: the day a mobile shell lands for f44 it turns green on its
# own and tells us.
name: Build Bluespin FP5
on:
  workflow_dispatch:
  schedule:
    - cron: '25 07 * * 1'

env:
  IMAGE_NAME: bluespin-fp5
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_fp5:
    name: Build FP5 image (f${{ matrix.fedora_branch }})
    # Native arm64. The image is aarch64 and qemu-user emulation of a full
    # desktop build - dracut, semodule, glib-compile-schemas - would take hours.
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        fedora_branch: ['44', 'rawhide']

    steps:
      # Fail an unsupported branch before paying for the submodule checkout,
      # the squeeze step and the ~2 GB base pull. primary.xml lists every
      # package in the COPR chroot; no gnome-shell there means no mobile shell
      # for this branch. build_fp5.sh repeats this check in-build as the
      # backstop.
      - name: Check the mobile shell exists for this branch
        run: |
          set -euo pipefail
          base="https://download.copr.fedorainfracloud.org/results/@mobility/gnome-mobile/fedora-${{ matrix.fedora_branch }}-aarch64"
          primary=$(curl -fsSL --retry 3 "${base}/repodata/repomd.xml" \
            | grep -oE 'href="repodata/[^"]*primary\.xml[^"]*"' | head -1 | sed 's/href="//;s/"//')
          curl -fsSL --retry 3 "${base}/${primary}" -o /tmp/primary
          case "${primary}" in
            *.zst) zstd -dc /tmp/primary > /tmp/primary.xml ;;
            *.gz)  gzip -dc /tmp/primary > /tmp/primary.xml ;;
            *)     mv /tmp/primary /tmp/primary.xml ;;
          esac
          if ! grep -q '<name>gnome-shell</name>' /tmp/primary.xml; then
            echo "::error::@mobility/gnome-mobile publishes no gnome-shell for fedora-${{ matrix.fedora_branch }}; nothing to build."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The vendored extensions are submodules; the build installs them
          submodules: recursive

      # Most of what this removes is x86-only toolchains that are simply absent
      # on an arm64 runner, so it must not be allowed to fail the build.
      - name: Maximize build space
        continue-on-error: true
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          # Overrides the bluespin.env default so the OCI description label
          # names the variant
          echo "IMAGE_DESC=Bluespin for the Fairphone 5" >> ${GITHUB_ENV}

      - name: Build Image
        run: |
          just build-fp5 ${{ matrix.fedora_branch }} ${{ matrix.fedora_branch }}

      # rpm-ostree rather than chunkah: CHUNKAH_IMAGE is a digest-pinned image
      # of unverified architecture, while this runs rpm-ostree out of the image
      # we just built and is therefore arm64 by construction.
      - name: Rechunk
        run: |
          just ostree-rechunk ${IMAGE_NAME} ${{ matrix.fedora_branch }}

      # What every extension declares, against the shell the image actually
      # shipped. This is what makes it safe for the build to assert only the
      # extensions we enable. Informational, so it must never block publishing.
      - name: Report GNOME compatibility
        if: always()
        continue-on-error: true
        run: |
          podman run --rm \
            -v "${PWD}/.github/scripts/report-extensions.sh:/tmp/report.sh:ro,Z" \
            --entrypoint bash "${IMAGE_NAME}:${{ matrix.fedora_branch }}" /tmp/report.sh \
            >> "$GITHUB_STEP_SUMMARY"

      # Nothing below runs for a leg that failed, so an unsupported branch
      # publishes nothing.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        id: push-image
        run: |
          set -euox pipefail
          DATE="$(date +%Y%m%d)"
          BRANCH="${{ matrix.fedora_branch }}"

          # Push once, then add the dated tag server-side. Pushing the same
          # local image twice does not guarantee the same manifest digest, which
          # would leave one tag unsigned; copying between registry refs reuses
          # the manifest so both tags share a digest and one signature covers
          # both. See the same note in build-rawhide.yml.
          podman push --digestfile=/tmp/digestfile \
            "${IMAGE_NAME}:${BRANCH}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${BRANCH}"

          digest=$(< /tmp/digestfile)

          skopeo copy \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}" \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${BRANCH}-${DATE}"

          echo "digest=${digest}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      # Both tags must resolve to the digest we are about to sign, and the
      # published image must be arm64 -- a runner or podman change that
      # silently produced amd64 would otherwise ship an image that cannot boot
      # on the device. The date comes from the push step, not a second
      # `date` call: a run that crosses UTC midnight between the two steps
      # would otherwise verify a tag that was never pushed, and fail after
      # publishing but before signing.
      - name: Verify the published tags
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
          DATE: ${{ steps.push-image.outputs.date }}
        run: |
          set -euo pipefail
          BRANCH="${{ matrix.fedora_branch }}"
          for tag in "${BRANCH}" "${BRANCH}-${DATE}"; do
            out="$(skopeo inspect --no-tags --format '{{.Digest}} {{.Architecture}}' \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}")"
            got="${out%% *}"
            arch="${out##* }"
            [[ "${got}" == "${DIGEST}" ]] || {
              echo "::error::${tag} is ${got}, expected ${DIGEST}"
              exit 1
            }
            [[ "${arch}" == "arm64" ]] || {
              echo "::error::${tag} is ${arch}, expected arm64"
              exit 1
            }
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.3'

      - name: Sign container image
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
