---
# Live installer ISOs for the desktop platforms -- x86, and for the
# generic aarch64 bluespin image too, since every floating bluespin tag
# is a multi-arch manifest and an arm runner pulling it gets the arm
# image. bluespin-fp5 is deliberately absent: a phone is flashed with
# fastboot, and its install medium is the disk image from
# build-disk.yml.
#
# Install media are release moments: the daily builds publish only the
# OCI images existing installs update from, and the ISOs build when a
# GitHub release is published (landing on that release) or by hand. Name
# the release after the Fedora branch it ships -- "45.0", "f45" --
# and the branch is read from the release tag; a dispatch names the
# image tag directly.
name: Build Bluespin ISOs
on:
  release:
    types:
      - published
  # A pull-request *-installer label: the build workflow shares the
  # leg's image as an artifact, and this fires when that run completes
  # to build the ISO from it -- no media pipeline lives in a build leg
  workflow_run:
    workflows:
      - Build Bluespin container image
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'image tag to build the ISOs from'
        type: string
        required: false
        default: 'latest'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_iso:
    name: ${{ matrix.image_name }} (${{ matrix.arch }}, iso)
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ${{ matrix.runner }}

    permissions:
      # write, not read: the release upload attaches an asset -- with
      # read the whole job would succeed and then 403 on the final step
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: bluespin
            arch: amd64
            runner: ubuntu-24.04
          # The generic aarch64 image's installer, on a native arm
          # runner. First of its kind here: if Titanoboa cannot produce
          # an arm ISO yet, this leg fails visibly on a release rather
          # than silently not existing.
          - image_name: bluespin
            arch: arm64
            runner: ubuntu-24.04-arm
          - image_name: bluespin-dx
            arch: amd64
            runner: ubuntu-24.04
          - image_name: bluespin-surface
            arch: amd64
            runner: ubuntu-24.04

    steps:
      - name: Maximize build space
        continue-on-error: true
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      # Dispatch names the tag; a release names the branch in its tag
      # ("45.0" -> 45), falling back to latest if it names none
      - name: Resolve the image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="$(grep -oE '4[0-9]|rawhide' <<< "${RELEASE_TAG}" | head -1 || true)"
            tag="${tag:-latest}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Builds a live ISO directly from the published bootc image; the
      # container-native ISO contract layer comes from the bluefin base
      - name: Build ISO with Titanoboa
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: ghcr.io/lorbuschris/${{ matrix.image_name }}:${{ steps.tag.outputs.tag }}
          iso-dest: ${{ github.workspace }}/${{ matrix.image_name }}-live-${{ matrix.arch }}.iso

      - name: Checksum ISO
        shell: bash
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          (cd "$(dirname "${ISO_PATH}")" && sha256sum "$(basename "${ISO_PATH}")" | tee "$(basename "${ISO_PATH}")-CHECKSUM")

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.image_name }}-live-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.iso-dest }}
            ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          compression-level: 0
          retention-days: 7

      - name: Upload release artifacts
        if: ${{ github.event_name == 'release' }}
        uses: svenstaro/upload-release-action@81c65b7cd4de9b2570615ce3aad67a41de5b1a13 # v2.11.2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_id: ${{ github.event.release.id }}
          file: ${{ steps.build.outputs.iso-dest }}*
          file_glob: true

  # The pull-request path: read the completed build run's plan, map its
  # -installer flags to legs, and build each ISO from that leg's shared
  # image artifact.
  plan-pr:
    name: plan (pr)
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      legs: ${{ steps.map.outputs.legs }}
      pr: ${{ steps.map.outputs.pr }}
    steps:
      - name: Download the build run's plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Map installer flags to legs
        id: map
        run: |
          set -euo pipefail
          legs='[]'
          addleg() { legs="$(jq -c ". + [$1]" <<< "${legs}")"; }
          for key in $(jq -r '.bluespin_installer[]' plan.json); do
            branch="${key%-*}"; arch="${key##*-}"
            addleg "{\"platform\":\"bluespin\",\"fedora_branch\":\"${branch}\",\"arch\":\"${arch}\",\"tag_suffix\":\"-${arch}\"}"
          done
          for key in $(jq -r '.dx_installer[]' plan.json); do
            branch="${key%-*}"
            addleg "{\"platform\":\"bluespin-dx\",\"fedora_branch\":\"${branch}\",\"arch\":\"amd64\",\"tag_suffix\":\"\"}"
          done
          for key in $(jq -r '.surface_installer[]' plan.json); do
            branch="${key%-*}"
            addleg "{\"platform\":\"bluespin-surface\",\"fedora_branch\":\"${branch}\",\"arch\":\"amd64\",\"tag_suffix\":\"\"}"
          done
          {
            echo "legs=${legs}"
            echo "pr=$(jq -r .pr plan.json)"
          } | tee -a "$GITHUB_OUTPUT"

  pr-iso:
    name: ${{ matrix.platform }} (${{ matrix.fedora_branch }}, ${{ matrix.arch }}, iso)
    needs: plan-pr
    if: ${{ needs.plan-pr.outputs.legs != '[]' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-pr.outputs.legs) }}
    steps:
      # For the local acquire-image action
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        continue-on-error: true
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Acquire the leg's image
        id: acquire
        uses: ./.github/actions/acquire-image
        with:
          platform: ${{ matrix.platform }}
          fedora_branch: ${{ matrix.fedora_branch }}
          tag_suffix: ${{ matrix.tag_suffix }}
          source: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Build ISO with Titanoboa
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: ${{ steps.acquire.outputs.ref }}
          iso-dest: ${{ github.workspace }}/${{ matrix.platform }}-live-${{ matrix.arch }}.iso

      - name: Checksum ISO
        shell: bash
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          (cd "$(dirname "${ISO_PATH}")" && sha256sum "$(basename "${ISO_PATH}")" | tee "$(basename "${ISO_PATH}")-CHECKSUM")

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.platform }}-live-${{ matrix.arch }}-pr-${{ needs.plan-pr.outputs.pr }}
          path: |
            ${{ steps.build.outputs.iso-dest }}
            ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          compression-level: 0
          retention-days: 7
