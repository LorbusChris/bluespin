---
# Live installer ISOs for the desktop platforms -- x86, and for the
# generic aarch64 bluespin image too, since every floating bluespin tag
# is a multi-arch manifest and an arm runner pulling it gets the arm
# image. bluespin-fp5 is deliberately absent: a phone is flashed with
# fastboot, and its install medium is the disk image from
# build-disk.yml.
#
# Each leg layers the container-native ISO contract onto the image it
# builds from -- Anaconda, the livesys session, a live initramfs and
# iso.yaml (`just live-image`, the Containerfile's live stage) -- and
# hands THAT to titanoboa. That layer is install media in container
# form, and it is published and signed like everything else this repo
# makes: <platform>-live:<branch>-<arch>, verified before it becomes an
# ISO. Nobody updates from a -live tag; it exists so the medium has a
# provenance chain, and so nothing that ships carries an installer it
# will never run. On pull requests it stays local, since a pull request
# publishes nothing. What an install tracks afterwards is the channel
# alias for its branch.
#
# Install media are release moments: the daily builds publish only the
# OCI images existing installs update from, and the ISOs build when a
# GitHub release is published (landing on that release) or by hand.
# Releases are per Fedora branch: name the release after the branch it
# ships -- "45.0", "f45" -- and the branch is read from the release
# tag; a dispatch names the image tag directly. Which ISOs a release
# gets is the registry's call, not a table's: one bluespin ISO per
# architecture the branch index actually serves (44 gets no arm ISO
# because 44 has no arm image), plus dx and surface where their tags
# exist. Publish as a PRE-release, let these runs attach their assets,
# then promote -- promotion fires no `published` event, so nothing
# rebuilds. Re-runs overwrite their assets, so a failed leg is a
# re-run, not a new release.
name: Build Installer
on:
  release:
    types:
      - published
  # A pull-request *-installer label: the build workflow shares the
  # leg's image as an artifact, and this fires when that run completes
  # to build the ISO from it -- no media pipeline lives in a build leg
  workflow_run:
    workflows:
      - Build
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'image tag to build the ISOs from'
        type: string
        required: false
        default: 'latest'
      release_id:
        description: 'optional release to upload the ISOs to'
        type: string
        required: false
  # release.yml calls this to build a pre-release's ISOs onto it before
  # promoting -- it cannot go through the release event, which a
  # GITHUB_TOKEN-created release never fires
  workflow_call:
    inputs:
      tag:
        description: 'image tag to build the ISOs from'
        type: string
        required: true
      release_id:
        description: 'release to upload the ISOs to'
        type: string
        required: false

concurrency:
  # The file's own name as a literal, not github.workflow: under
  # workflow_call that context names the CALLER, and the release
  # workflow's two media calls must not land in one group and cancel
  # each other
  group: build-installer-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Release and dispatch legs come from the registry, not a table: the
  # resolved tag's index says which architectures exist, and each one
  # becomes a bluespin ISO leg -- a rawhide release works the moment
  # on-demand builds have published rawhide's index, and fails visibly
  # before. dx and surface get a leg where their tag resolves.
  plan-release:
    name: plan (release)
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.map.outputs.legs }}
      tag: ${{ steps.map.outputs.tag }}
    env:
      IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
    steps:
      # Dispatch names the tag; a release names the branch in its tag
      # ("45.0" -> 45), falling back to latest if it names none
      - name: Resolve the tag and map the legs
        id: map
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          reg="${IMAGE_REGISTRY,,}"
          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="$(grep -oE '4[0-9]|rawhide' <<< "${RELEASE_TAG}" | head -1 || true)"
            tag="${tag:-latest}"
          fi

          legs='[]'
          addleg() { legs="$(jq -c ". + [$1]" <<< "${legs}")"; }
          # One bluespin installer per architecture the branch index
          # serves, each on a native runner (derived from the arch, so
          # the leg objects stay the job's display name). The arm
          # installer is first of its kind here: if Titanoboa cannot
          # produce one yet, that leg fails visibly on a release rather
          # than silently not existing.
          for arch in $(skopeo inspect --raw "docker://${reg}/bluespin:${tag}" \
              | jq -r '[.manifests[]?.platform.architecture // empty] | unique | .[]'); do
            case "${arch}" in
              amd64|arm64) ;;
              *) continue ;;
            esac
            addleg "{\"image_name\":\"bluespin\",\"fedora_branch\":\"${tag}\",\"arch\":\"${arch}\"}"
          done
          for name in bluespin-dx bluespin-surface; do
            if skopeo inspect --no-tags --format '{{.Digest}}' \
                "docker://${reg}/${name}:${tag}" > /dev/null 2>&1; then
              addleg "{\"image_name\":\"${name}\",\"fedora_branch\":\"${tag}\",\"arch\":\"amd64\"}"
            else
              echo "::warning::${name}:${tag} is not published; no installer for it"
            fi
          done
          [[ "${legs}" != "[]" ]] || {
            echo "::error::no published images serve tag ${tag}; nothing to build installers from"
            exit 1
          }

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "legs=${legs}" >> "$GITHUB_OUTPUT"

  # No name: -- a matrix name template renders raw in the checks list
  # whenever the job is skipped (every workflow_run event skips this
  # one), so the legs carry the display: installer (bluespin, 44, amd64)
  installer:
    needs: plan-release
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    permissions:
      # write, not read: the release upload attaches an asset -- with
      # read the whole job would succeed and then 403 on the final step
      contents: write
      # The medium's own image is published and signed here, the way
      # every other image in the family is
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-release.outputs.legs) }}

    steps:
      - name: Maximize build space
        continue-on-error: true
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      # For the Containerfile's live stage and build_files/live.sh
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.3'

      # Titanoboa mounts the image as a container volume out of ROOT's
      # storage (sudo podman run --mount type=image) and pulls nothing
      # itself -- podman does not pull for an image volume, so the image
      # has to be there first or the mount fails with "image not known"
      - name: Pull the image into root's storage
        env:
          IMAGE_REF: ghcr.io/lorbuschris/${{ matrix.image_name }}:${{ needs.plan-release.outputs.tag }}
        run: sudo podman pull "${IMAGE_REF}"

      # The medium's own layer -- Anaconda, the livesys session, a live
      # initramfs, the ISO contract -- on top of the image it installs.
      # sudo, because the result has to land in the storage titanoboa
      # mounts from.
      - name: Build the live layer
        env:
          BASE_REF: ghcr.io/lorbuschris/${{ matrix.image_name }}:${{ needs.plan-release.outputs.tag }}
          PLATFORM: ${{ matrix.image_name }}
          BRANCH: ${{ needs.plan-release.outputs.tag }}
          LIVE_REF: ghcr.io/lorbuschris/${{ matrix.image_name }}-live:${{ needs.plan-release.outputs.tag }}-${{ matrix.arch }}
        run: |
          sudo --preserve-env=PATH,BASE_REF,PLATFORM,BRANCH,LIVE_REF "$(which just)" \
            live-image "${BASE_REF}" "${PLATFORM}" "${BRANCH}" "${LIVE_REF}"

      # Install media is published like anything else this repo makes:
      # the ISO below is built from an image anyone can pull, verify and
      # rebuild from. Nobody updates from a -live tag -- it exists so the
      # medium has a provenance chain, not to be anybody's target.
      # --creds, because root's podman has no login of its own.
      - name: Publish the live image
        id: live
        env:
          LIVE_REF: ghcr.io/lorbuschris/${{ matrix.image_name }}-live:${{ needs.plan-release.outputs.tag }}-${{ matrix.arch }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo --preserve-env=LIVE_REF,REGISTRY_USER,REGISTRY_PASSWORD podman push \
            --creds "${REGISTRY_USER}:${REGISTRY_PASSWORD}" \
            --digestfile /tmp/live-digest "${LIVE_REF}"
          digest="$(sudo cat /tmp/live-digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${LIVE_REF} (${digest})"

      # Keyed then keyless, the same pair sign.yml applies to everything
      # else, then verified before a single byte of it reaches an ISO
      - name: Sign and verify the live image
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST_REF: ghcr.io/lorbuschris/${{ matrix.image_name }}-live@${{ steps.live.outputs.digest }}
        run: |
          set -euo pipefail
          .github/scripts/retry.sh 3 30 \
            cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${DIGEST_REF}"
          .github/scripts/retry.sh 3 30 \
            cosign sign -y --new-bundle-format=false --use-signing-config=false "${DIGEST_REF}"
          cosign verify --key cosign.pub "${DIGEST_REF}" > /dev/null
          echo "signature verified for ${DIGEST_REF}"

      # Builds the live ISO from that image: everything the ISO carries
      # is in the container image, which is the point of the contract
      - name: Build ISO with Titanoboa
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: ghcr.io/lorbuschris/${{ matrix.image_name }}-live:${{ needs.plan-release.outputs.tag }}-${{ matrix.arch }}
          iso-dest: ${{ github.workspace }}/${{ matrix.image_name }}-${{ needs.plan-release.outputs.tag }}-live-${{ matrix.arch }}.iso

      - name: Checksum ISO
        shell: bash
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          (cd "$(dirname "${ISO_PATH}")" && sha256sum "$(basename "${ISO_PATH}")" | tee "$(basename "${ISO_PATH}")-CHECKSUM")

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.image_name }}-${{ needs.plan-release.outputs.tag }}-live-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.iso-dest }}
            ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          compression-level: 0
          retention-days: 7

      - name: Upload release artifacts
        # A release event names its own release; a call or dispatch can
        # name one
        if: ${{ inputs.release_id || github.event_name == 'release' }}
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_id: ${{ inputs.release_id || github.event.release.id }}
          file: ${{ steps.build.outputs.iso-dest }}*
          file_glob: true
          # A re-run of a failed or partial release run must be able to
          # replace what an earlier attempt attached
          overwrite: true

  # The pull-request path: read the completed build run's plan, map its
  # -installer flags to legs, and build each ISO from that leg's shared
  # image artifact.
  plan-pr:
    name: plan (pr)
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      legs: ${{ steps.map.outputs.legs }}
      pr: ${{ steps.map.outputs.pr }}
    steps:
      - name: Download the build run's plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Map installer flags to legs
        id: map
        run: |
          set -euo pipefail
          legs='[]'
          addleg() { legs="$(jq -c ". + [$1]" <<< "${legs}")"; }
          # Only what names the leg: the tag suffix follows from the
          # platform, and a matrix field would land in the job's name
          for key in $(jq -r '.bluespin_installer[]' plan.json); do
            branch="${key%-*}"; arch="${key##*-}"
            addleg "{\"platform\":\"bluespin\",\"fedora_branch\":\"${branch}\",\"arch\":\"${arch}\"}"
          done
          for key in $(jq -r '.dx_installer[]' plan.json); do
            branch="${key%-*}"
            addleg "{\"platform\":\"bluespin-dx\",\"fedora_branch\":\"${branch}\",\"arch\":\"amd64\"}"
          done
          for key in $(jq -r '.surface_installer[]' plan.json); do
            branch="${key%-*}"
            addleg "{\"platform\":\"bluespin-surface\",\"fedora_branch\":\"${branch}\",\"arch\":\"amd64\"}"
          done
          {
            echo "legs=${legs}"
            echo "pr=$(jq -r .pr plan.json)"
          } | tee -a "$GITHUB_OUTPUT"

  # No name: -- see the installer job above; skipped matrix jobs would
  # show the template itself
  pr-installer:
    needs: plan-pr
    if: ${{ needs.plan-pr.outputs.legs != '[]' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      actions: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-pr.outputs.legs) }}
    steps:
      # workflow_run runs never appear on the pull request's checks;
      # a commit status on the head SHA does, and links here
      - name: Report building (commit status)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONTEXT: ${{ matrix.platform }} (${{ matrix.fedora_branch }}, ${{ matrix.arch }}, installer)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=pending -f context="${CONTEXT}" \
            -f target_url="${RUN_URL}" -f description="building"

      # For the local acquire-image action
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        continue-on-error: true
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Acquire the leg's image
        id: acquire
        uses: ./.github/actions/acquire-image
        with:
          platform: ${{ matrix.platform }}
          fedora_branch: ${{ matrix.fedora_branch }}
          # Only the bluespin legs publish per-arch instance tags
          tag_suffix: ${{ matrix.platform == 'bluespin' && format('-{0}', matrix.arch) || '' }}
          source: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          # Titanoboa reads it from root's storage, under sudo
          storage: root

      # The same layer the release path publishes, kept local: a pull
      # request publishes nothing, so this one is signed by nothing and
      # goes no further than the ISO in this run's artifacts
      - name: Build the live layer
        env:
          BASE_REF: ${{ steps.acquire.outputs.ref }}
          PLATFORM: ${{ matrix.platform }}
          BRANCH: ${{ matrix.fedora_branch }}
        run: |
          sudo --preserve-env=PATH,BASE_REF,PLATFORM,BRANCH "$(which just)" \
            live-image "${BASE_REF}" "${PLATFORM}" "${BRANCH}"

      - name: Build ISO with Titanoboa
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/${{ matrix.platform }}-live:${{ matrix.fedora_branch }}
          iso-dest: ${{ github.workspace }}/${{ matrix.platform }}-live-${{ matrix.arch }}.iso

      - name: Checksum ISO
        shell: bash
        run: |
          set -euo pipefail
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          (cd "$(dirname "${ISO_PATH}")" && sha256sum "$(basename "${ISO_PATH}")" | tee "$(basename "${ISO_PATH}")-CHECKSUM")

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.platform }}-live-${{ matrix.arch }}-pr-${{ needs.plan-pr.outputs.pr }}
          path: |
            ${{ steps.build.outputs.iso-dest }}
            ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          compression-level: 0
          retention-days: 7

      - name: Report built (commit status)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONTEXT: ${{ matrix.platform }} (${{ matrix.fedora_branch }}, ${{ matrix.arch }}, installer)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=success -f context="${CONTEXT}" \
            -f target_url="${RUN_URL}" -f description="installer ISO in this run's artifacts"

      - name: Report failed (commit status)
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONTEXT: ${{ matrix.platform }} (${{ matrix.fedora_branch }}, ${{ matrix.arch }}, installer)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state=failure -f context="${CONTEXT}" \
            -f target_url="${RUN_URL}" -f description="failed"
