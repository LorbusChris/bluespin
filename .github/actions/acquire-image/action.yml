---
# Resolve a built bluespin-family image for a follow-on workflow. Pull
# requests publish nothing -- their legs share the built image as a
# workflow artifact -- while pushes publish to the registry; one action
# so every consumer (the media builds, image scanning, the GNOME
# report) acquires the same way and the two sources cannot drift.
name: Acquire a built image
description: >-
  Fetch a built image either from a build run's shared-image artifact
  (pull requests) or from the registry (pushes), and output a reference
  the consumer can use. Rootless by default; storage=root for the tools
  that run under sudo and resolve refs from root's container storage.

inputs:
  platform:
    description: Image platform, e.g. bluespin or bluespin-fp5
    required: true
  fedora_branch:
    description: Fedora branch of the leg
    required: true
  tag_suffix:
    description: Arch suffix of the leg's tag, e.g. -amd64 (empty for the variants)
    required: false
    default: ''
  source:
    description: artifact (pull requests) or registry (pushes)
    required: true
  run-id:
    description: The build run holding the shared-image artifact (artifact source)
    required: false
    default: ''
  registry:
    description: Registry prefix, e.g. ghcr.io/owner (registry source)
    required: false
    default: ''
  github-token:
    description: Token for the cross-run artifact download
    required: false
    default: ''
  storage:
    description: >-
      Which container storage the image must land in -- rootless (the
      default) or root, for consumers that run podman under sudo
    required: false
    default: rootless

outputs:
  ref:
    description: A pullable/usable image reference (local for artifact, digest-pinned for registry)
    value: ${{ steps.resolve.outputs.ref }}

runs:
  using: composite
  steps:
    - name: Download the shared image
      if: inputs.source == 'artifact'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: image-${{ inputs.platform }}-${{ inputs.fedora_branch }}${{ inputs.tag_suffix }}
        path: /tmp/acquired-image
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Resolve the reference
      id: resolve
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        REGISTRY: ${{ inputs.registry }}
        PLATFORM: ${{ inputs.platform }}
        BRANCH: ${{ inputs.fedora_branch }}
        SUFFIX: ${{ inputs.tag_suffix }}
        STORAGE: ${{ inputs.storage }}
      run: |
        set -euo pipefail
        # Storage is per user: an image loaded rootless is invisible to
        # `sudo podman`, and image-builder and Titanoboa both resolve
        # their refs from root's storage.
        sudo=()
        [[ "${STORAGE}" == "root" ]] && sudo=(sudo)

        if [[ "${SOURCE}" == "artifact" ]]; then
          ref="$("${sudo[@]}" podman load -q -i /tmp/acquired-image/shared-image.oci | sed -n 's/^Loaded image[^:]*: //p' | head -1)"
          rm -rf /tmp/acquired-image
          [[ -n "${ref}" ]] || { echo "::error::podman load reported no image"; exit 1; }
        else
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          reg="${REGISTRY,,}"
          tag="${BRANCH}${SUFFIX}"
          digest="$(skopeo inspect --no-tags --format '{{.Digest}}' \
            "docker://${reg}/${PLATFORM}:${tag}")"
          ref="${reg}/${PLATFORM}:${tag}@${digest}"
          # Registry refs are pulled on use -- except by the sudo tools,
          # which mount the image rather than pull it
          [[ "${STORAGE}" == "root" ]] && sudo podman pull -q "${ref}" > /dev/null
        fi
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"
