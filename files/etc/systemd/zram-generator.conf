# zram sizing for the desktop platforms. The main file in /etc rather than a
# /usr/lib drop-in on purpose: the phone's device layer ships its own main
# file (ram * 2, devices/common) over this one, and a drop-in would override
# that too.
#
# Fedora's default is min(ram, 8192): all of RAM up to 8 GB, and a flat 8 GB
# above -- an eighth of a 64 GB workstation, which is how a developer box
# with a 50 GB VS Code session filled its swap and thrashed itself into a
# hard reset (docs/memory-pressure.md). This keeps Fedora's curve up to
# 16 GB of RAM and lets it grow to half of RAM above, capped at 16 GB:
#
#     RAM    4   8   16   32   64  GB
#     zram   4   8    8   16   16  GB
#
# Bazzite ships the same shape on its desktop images, min(ram / 2, 16384)
# with zstd; this differs only in keeping Fedora's generosity below 16 GB,
# where Bazzite's halves it. Bluefin ships Fedora's.
#
# zstd over Fedora's lzo-rle: it compresses this kind of memory (JS heaps,
# indexer tables) markedly better -- the measured lzo-rle ratio was 2.5:1 --
# for CPU every desktop here has to spare. A full 16 GB device then costs
# roughly 5-6 GB of RAM.
[zram0]
zram-size = min(max(ram / 2, min(ram, 8192)), 16384)
compression-algorithm = zstd
