# Swap behaviour for a machine whose swap is zram first, with a disk file
# behind it on request (`ujust setup-swapfile`). See docs/memory-pressure.md.

# Swap in one page at a time rather than clusters of eight (2^3). Read-ahead
# buys nothing on zram, where a "seek" is a memcpy, and next to nothing on
# NVMe -- while under pressure the seven extra pages it drags in are exactly
# what evicts something still needed. The usual setting for zram.
vm.page-cluster = 0

# Reclaim idle anonymous memory into zram as readily as file cache. The
# default of 60 protects anonymous pages because swap used to be a slow disk;
# with zram the cheaper thing to drop is the idle heap, and what keeps a
# desktop responsive under pressure is the file cache holding the binaries
# and libraries of whatever is on screen.
vm.swappiness = 100
