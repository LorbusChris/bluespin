# The scope gnome-shell launches VS Code in. The main process leaves it for
# its own (see app-com.microsoft.VSCode-.scope.d); what stays behind is
# Chromium's plumbing -- zygotes, the GPU process, one renderer per window --
# a few GB at most. A generous box: a renderer that runs away is killed
# alone, and VS Code offers to reload that window.
[Scope]
MemoryMax=25%
MemorySwapMax=5%
OOMPolicy=continue
