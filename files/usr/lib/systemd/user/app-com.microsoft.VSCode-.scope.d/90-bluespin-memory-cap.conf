# A memory box for VS Code, so that whatever runs away inside it -- a C/C++
# indexer, a language server, an agent session, a build in the integrated
# terminal -- is killed inside VS Code rather than taking the desktop down
# with it. docs/memory-pressure.md has the incident this answers.
#
# Electron moves VS Code's main process into app-com.microsoft.VSCode-<pid>
# .scope (the name is the desktop file's id; dx.sh asserts it still is) and
# everything it spawns afterwards lands there: extension hosts, language
# servers, terminals and their children. systemd applies this directory to
# every such scope by dash-truncated name matching, running instances
# included on the next daemon-reload. The percentages are of physical RAM.
#
# MemoryMax: the wall. Reaching it, the kernel reclaims the scope's own
#   pages into swap and, once that no longer frees enough, kills the single
#   largest process inside -- the indexer, one agent session -- and VS Code
#   lives on. Nothing outside the scope is touched.
# MemorySwapMax: how far that reclaim may go before the kill comes, so a
#   box at its wall cannot thrash in swap for long.
# OOMPolicy=continue: without it the user manager's default (stop) answers
#   that one kernel kill by terminating the entire scope -- all of VS Code
#   and every session in it.
# No MemoryHigh: its throttling exists for an external monitor to act on,
#   and the monitor here, systemd-oomd, acts by killing the whole cgroup.
[Scope]
MemoryMax=75%
MemorySwapMax=10%
OOMPolicy=continue
