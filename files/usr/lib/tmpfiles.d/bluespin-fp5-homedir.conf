# The disk image's blueprint (disk/blueprint.toml) creates the `bluespin`
# rescue account, but image-builder does not materialise home directories for
# blueprint users (osbuild/image-builder#2596), and /var/home on this image is
# a fresh btrfs subvolume, so nothing else creates one either. Seed it from
# /etc/skel at boot -- the same fix pocketblue carries for its own blueprint
# user. Without it, the account documented as the recovery path lands in a
# nonexistent home directory exactly when it is needed.
C /var/home/bluespin 0700 bluespin bluespin - /etc/skel
