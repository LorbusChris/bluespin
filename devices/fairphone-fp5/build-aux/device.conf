install_dtb=true
split_partitions=true
# Flash contracts, consumed by tools/postprocess/verify-images.sh: the ESP is
# dd'd onto the logdump partition, which is exactly 512 MiB on the device, and
# u-boot needs this device's blob in the dtb tree the ESP carries.
esp_size_bytes=536870912
dtb_name=qcm6490-fairphone-fp5.dtb
